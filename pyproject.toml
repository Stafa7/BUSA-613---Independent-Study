[build-system]
requires = ["setuptools==81.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "health-misinfo-study"
version = "0.1.0"
description = "Reproducible first-half pipeline for the BUSA 613 health misinformation independent study."
requires-python = "==3.11.*"
dependencies = [
    "accelerate>=1.1.0",
    "datasets",
    "evaluate",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "pytest",
    "pyyaml",
    "scikit-learn",
    "seaborn",
    "torch",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
narratives = [
    "bertopic",
    "hdbscan",
    "sentence-transformers",
    "umap-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
