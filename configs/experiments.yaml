random_seed: 613
data_quality:
  minimum_primary_body_words: 30
  fuzzy_title_similarity: 0.97
  coaid_primary_units: [article]
  fakehealth_primary_units: [story, news_release]
split:
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15
  minimum_controlled_test_records: 100
  minimum_controlled_test_records_per_class: 30
  minimum_controlled_validation_records: 100
  minimum_controlled_validation_records_per_class: 20
  minimum_controlled_groups_per_class: 5
  maximum_controlled_prevalence_shift: 0.20
  maximum_controlled_group_fraction: 0.35
  minimum_effective_controlled_groups: 5.0
  source_disjoint_attempts: 500
  source_disjoint_repeat_attempts: 100
  source_disjoint_repeats: 10
  minimum_successful_source_disjoint_repeats: 5
  hosting_domain_disjoint_attempts: 5000
models:
  tfidf:
    max_features: 20000
    max_features_grid: [10000, 20000]
    ngram_range: [1, 2]
    min_df: 2
    min_df_grid: [5, 2]
    sublinear_tf: false
    sublinear_tf_grid: [false, true]
  logistic_regression:
    max_iter: 1000
    class_weight: balanced
    c_grid: [0.1, 1.0, 10.0]
  linear_svm:
    class_weight: balanced
    c_grid: [0.1, 1.0, 10.0]
  transformers:
    - experiment_name: distilbert
      model_name: distilbert/distilbert-base-uncased
      revision: 12040ac
      max_length: 512
    - experiment_name: modernbert
      model_name: answerdotai/ModernBERT-base
      revision: 8949b90
      max_length: 512
    - experiment_name: biomedbert
      model_name: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext
      revision: 10b8ceaf55f21891daba5639985e530ebb9b423d
      max_length: 512
  transformer_training:
    accelerator_preference: [cuda, mps]
    allow_cpu: false
    primary_seed: 613
    seeds: [613, 614, 615]
    epochs: 3
    batch_size: 8
    learning_rate: 0.00002
    early_stopping_patience: 1
  transformer_tuning:
    enabled: true
    reference_model: distilbert
    split: standard
    datasets: [coaid, fakehealth]
    seed: 613
    learning_rate_grid: [0.00001, 0.00002, 0.00003]
    selection_metric: mean_validation_macro_f1
metrics:
  bootstrap_iterations: 1000
  positive_label: unreliable
  primary_metric: macro_f1
  artifact_equivalence_margin: 0.03
  primary_comparisons:
    - text_logistic_vs_publisher_only_on_controlled
    - text_logistic_vs_length_only_on_controlled
    - standard_vs_artifact_removed_equivalence
  multiplicity_rule: Holm correction is required if primary-comparison p-values are added; current interval results are reported without binary significance labels.
